<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      :root {
        --icon-bg: #F4F4F0;
        --icon-bar-1: #2F5049;
        --icon-bar-2: #2F5049;
        --icon-bar-3: #546E51;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --icon-bg: #14181B;
          --icon-bar-1: #6FA89C;
          --icon-bar-2: #6FA89C;
          --icon-bar-3: #8FB589;
        }
      }
    </style>
  </defs>
  <rect width="32" height="32" rx="7" fill="var(--icon-bg)" />
  <!-- Three Angled Nordic Telemetry Bars -->
  <g transform="translate(6, 6)">
    <!-- Bar 1: Short -->
    <path d="M 2 12.5 L 4.5 12.5 L 3.2 20 L 0.7 20 Z" fill="var(--icon-bar-1)" rx="0.5" />
    <!-- Bar 2: Medium -->
    <path d="M 8.5 6 L 11 6 L 8.5 20 L 6 20 Z" fill="var(--icon-bar-2)" rx="0.5" />
    <!-- Bar 3: Tall -->
    <path d="M 15 0 L 17.5 0 L 14 20 L 11.5 20 Z" fill="var(--icon-bar-3)" rx="0.5" />
  </g>
</svg>
